# Tells Prometheus to scrape the backend's /metrics every 15 seconds.
# Apply only AFTER installing kube-prometheus-stack (Phase 6).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: notes
  labels:
    release: monitoring # must match the Helm release name
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
