# Nginx does two jobs in the frontend container:
#  1. Serves the static React files (HTML, CSS, JS)
#  2. Forwards /api/ requests to the private backend Service (reverse proxy)
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for the Kubernetes probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API calls -> backend. "backend" is the Service name (Kubernetes) or the
    # service name in compose.yaml - both resolve through internal DNS.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else -> the React app (index.html handles in-app routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
