# ---------------------------------------------------------------
# CACHE: Redis
# A Deployment is fine here: a cache holds copies of data that can
# be rebuilt from Postgres, so it needs no disk.
# ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: notes
  labels:
    app: redis
spec:
  type: ClusterIP # private, only reachable inside the cluster
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 100mb
            - --maxmemory-policy
            - allkeys-lru # when full, drop the least recently used keys
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 160Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
